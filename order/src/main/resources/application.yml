server:
  port: 8085

spring:
  application:
    name: order-service
  datasource:
    url: jdbc:postgresql://localhost:5432/order_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true

security:
  jwt:
    secret: AbCdEfGhIjKlMnOpQrStUvWxYz1234567890abcd=AbCdEfGhIjKlMnOpQrStUvWxYz1234567890abcd=AbCdEfGhIjKlMnOpQrStUvWxYz1234567890abcd=

services:
  product:
    base-url: http://localhost:8082
  customer:
    base-url: http://localhost:8083
  inventory:
    base-url: http://localhost:8084

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - metrics

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

